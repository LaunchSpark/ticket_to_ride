[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ticket-to-ride"
version = "0.1.0"
description = "Native Ticket to Ride engine and backend services."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "uvicorn>=0.30,<1.0",
]

[project.scripts]
run = "ticket_to_ride.runtime.cli:run"
test = "ticket_to_ride.runtime.cli:test"

[tool.hatch.build.targets.wheel]
packages = ["services/native-runtime/src/ticket_to_ride"]
